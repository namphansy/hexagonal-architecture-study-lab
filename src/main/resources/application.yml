spring:
  application:
    name: order-service
  profiles:
    active: jpa
  datasource:
    url: jdbc:h2:mem:orders;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.order.adapter.in.messaging
        spring.json.value.default.type: com.example.order.adapter.in.messaging.CreateOrderMessage

server:
  port: 8080

external:
  customer-service:
    base-url: http://localhost:8081
  inventory-service:
    base-url: http://localhost:8082

messaging:
  kafka:
    topics:
      create-order-command: order-create-commands
      order-created: order-created
